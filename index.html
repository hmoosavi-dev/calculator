<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="normalize.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
    <title>Calculator</title>
  </head>
  <body>
    <div class="calculator">
      <div class="display">
        <input type="text" class="display-screen" disabled />
      </div>
      <div class="buttons">
        <button class="operator double-zero" value="00">..</button>
        <button class="operator history" value="history">H</button>
        <button class="operator clear" value="clear">C</button>
        <button class="operator backspace" value="backspace">&larr;</button>

        <button class="number" value="7">7</button>
        <button class="number" value="8">8</button>
        <button class="number" value="9">9</button>
        <button class="operator divide func" value="/">&divide;</button>

        <button class="number" value="4">4</button>
        <button class="number" value="5">5</button>
        <button class="number" value="6">6</button>
        <button class="operator multiply func" value="*">&times;</button>

        <button class="number" value="1">1</button>
        <button class="number" value="2">2</button>
        <button class="number" value="3">3</button>

        <button class="operator minus func" value="-">-</button>
        <button class="operator equals" value="=">=</button>
        <button class="number zero" value="0">0</button>
        <button class="decimal" value=".">.</button>
        <button class="operator plus func" value="+">+</button>
      </div>
    </div>
    <div class="history-screen invisible"></div>
  </body>
</html>
